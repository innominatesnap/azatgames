name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # opened only: an Issue created with an assignee fires opened AND assigned with the same
  # @claude body, which would start two runs. Re-ring with a new @claude comment instead.
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    # One Claude run per Issue/PR at a time: a second ring queues behind the first instead of
    # running in parallel. Job-level (not workflow-level) so skipped runs, e.g. comments without
    # the mention, never take the slot or replace a queued real run.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout vault (read-only design specs and packets)
        uses: actions/checkout@v6
        with:
          repository: innominatesnap/azattech-grokbots
          token: ${{ secrets.VAULT_READ_TOKEN }}
          path: .vault
          persist-credentials: false

      - name: Keep vault out of commits
        run: echo ".vault/" >> .git/info/exclude

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'
          claude_args: |
            --allowedTools "Bash(gh pr create:*),Bash(gh pr list:*),Bash(gh pr view:*)"
            --append-system-prompt "After your final push to a new branch, open the pull request yourself: run gh pr list --head <branch> --state open, and if none is open run gh pr create --base <default branch> --head <branch> --title <latest commit subject> --body <short summary plus Refs #issue>. GH_TOKEN in your shell is already the Claude App token, so CI runs on that PR. Put the PR URL in your status block; do not stop at only a Create PR link. A workflow step after this one flags any pushed branch still left without a PR."

      # Safety net (azattech-grokbots#181): the action revokes the Claude App token before this
      # step runs, and a PR opened with GITHUB_TOKEN would not start CI, so this step never opens
      # the PR. If Claude pushed a branch and no PR is open for it, it posts one flag comment.
      - name: Flag a pushed branch that has no PR
        if: always() && steps.claude.outputs.branch_name != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          BASE=$(gh api "repos/$REPO" -q .default_branch)
          AHEAD=$(gh api "repos/$REPO/compare/$BASE...$BRANCH" -q .ahead_by 2>/dev/null)
          if [ -z "$AHEAD" ] || [ "$AHEAD" = "0" ]; then echo "No commits on $BRANCH ahead of $BASE"; exit 0; fi
          OPEN=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json url -q '.[0].url')
          if [ -n "$OPEN" ]; then echo "PR already open: $OPEN"; exit 0; fi
          if [ -z "$NUM" ]; then echo "No Issue or PR to comment on"; exit 0; fi
          MARK="<!-- claude-no-pr:$BRANCH -->"
          if gh api "repos/$REPO/issues/$NUM/comments" --paginate -q '.[].body' | grep -qF "$MARK"; then echo "Already flagged"; exit 0; fi
          TITLE=$(gh api "repos/$REPO/commits/$BRANCH" -q '.commit.message' | head -n1)
          Q=$(jq -rn --arg t "$TITLE" --arg b "Opened from Claude's run $RUN_URL. Refs #$NUM" '"title=\($t|@uri)&body=\($b|@uri)"')
          printf '%s\n%s\n' "$MARK" "**No PR yet:** Claude pushed \`$BRANCH\` ($AHEAD commit(s) ahead of \`$BASE\`) but no pull request is open. [Create PR]($GITHUB_SERVER_URL/$REPO/compare/$BASE...$BRANCH?quick_pull=1&$Q) · [run]($RUN_URL)" > /tmp/no-pr.md
          gh issue comment "$NUM" -R "$REPO" --body-file /tmp/no-pr.md || true
          exit 0
